<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Lady ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2c3e50, #34495e); /* Serious color tone */
      font-family: "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
      color: #ecf0f1;
    }.card {
  background: #1c2833; /* Darker card tone */
  padding: 40px 30px;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  text-align: center;
  max-width: 400px;
  width: 90%;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 22px;
  margin-bottom: 10px;
  color: #ecf0f1;
}

p {
  font-size: 16px;
  margin-bottom: 30px;
  color: #bdc3c7;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  position: relative;
  height: 60px;
}

button {
  padding: 12px 28px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  font-weight: bold;
}

#yesBtn {
  background: #27ae60; /* Green for positive */
  color: white;
}

#noBtn {
  background: #c0392b; /* Prominent red */
  color: white;
  position: absolute; /* moves dynamically */
}

.celebrate {
  display: none;
  color: #ecf0f1;
}

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 4s linear forwards;
  opacity: 0.8;
  z-index: 1;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 0.9; }
  100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}

  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Happy 25th, Tushna ❤️</h1>
    <p>
      You make my days better just by being you.<br />
      Would you like to walk this year of life with me?
    </p>
    <div class="buttons" id="buttons">
      <button id="yesBtn">YES</button>
      <button id="noBtn">NO</button>
    </div><!-- Happy Birthday Instrumental -->
<audio id="music" loop>
  <source src="https://actions.google.com/sounds/v1/celebration/happy_birthday.ogg" type="audio/ogg">
</audio>

<div class="celebrate" id="celebrate">
  <h2>Yay! 🎉❤️</h2>
  <p>Best decision ever. Here's to us ✨</p>
  <p style="margin-top:10px;font-weight:500;">Thank you for existing in my life all these years. <br>Now you’re stuck with me at least till next year 😌</p>
</div>

  </div>  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const buttons = document.getElementById("buttons");
    const celebrate = document.getElementById("celebrate");
    const music = document.getElementById("music");

    let noScale = 1;
    let yesScale = 1;

    function initializeButtons() {
      noBtn.style.position = 'relative';
      noBtn.style.left = '0';
      noBtn.style.top = '0';
    }

    function moveNoButton() {
      noBtn.style.position = 'absolute';
      const maxX = buttons.clientWidth - noBtn.offsetWidth;
      const maxY = buttons.clientHeight - noBtn.offsetHeight;
      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";

      noScale = Math.max(0.4, noScale - 0.1);
      noBtn.style.transform = `scale(${noScale})`;

      yesScale += 0.1;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton);

    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      celebrate.style.display = "block";
      music.play(); // play happy birthday music
      startHearts();
    });

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = 16 + Math.random() * 20 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }, 300);
    }

    initializeButtons();
  </script></body>
</html>
